# Builds and tests every module. Pull requests run the Ubuntu build only; the Windows build and the
# Minestom end-to-end job run on pushes to main, nightly, by hand, or on a PR labelled "full-ci"
# (ADR 0025: Actions minutes on a private repo, Windows costs 2x). See ADR 0012 and ADR 0022.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "msc-docs/**"
      - "*.md"
      - "msc-*/README.md"
      - "msc-*/PLAN.md"
  pull_request:
    # "labeled" lets the full-ci label start a full run; other labels skip every job (see the job ifs) and get a
    # concurrency group of their own, so they cannot cancel the PR's running build.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore:
      - "docs/**"
      - "msc-docs/**"
      - "*.md"
      - "msc-*/README.md"
      - "msc-*/PLAN.md"
  schedule:
    # Nightly full run (Windows + e2e) on main.
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run (saves Actions minutes). Concurrency applies before
# the job ifs, so a label other than full-ci gets a group of its own (its run id) and cancels nothing.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || 'run' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    # On a labelled event, run only when the label is full-ci.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the other: an OS-specific failure is the thing to see.
      fail-fast: false
      matrix:
        # PRs: Ubuntu only, unless labelled full-ci. Everything else: Ubuntu and Windows.
        os: ${{ fromJSON((github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci')) && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    defaults:
      run:
        # Git Bash on Windows, so ./gradlew and every run step read the same on both.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's dependencies, wrapper and build cache (including Loom's Minecraft files).
      # Only main writes the cache; other branches and PRs read it.
      - uses: gradle/actions/setup-gradle@v6

      # The default build runs unit tests only. Template builds and the Minestom server run in the
      # e2e job; nothing in CI accepts the Mojang EULA, so no Paper or Fabric server is started.
      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"
          retention-days: 7

  e2e:
    name: End to end on Minestom (${{ matrix.os }})
    # Not on ordinary PRs: main, nightly, by hand, or a PR labelled full-ci. Like build, a labelled event runs it only
    # when the label is full-ci, so adding another label to a full-ci PR does not start it again.
    if: >-
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Minestom has no EULA, so this is the one real server CI may start. e2eTest scaffolds minestom-game, then
      # drives it through the installed core over MCP stdio: dev_cycle, build_batch, world tools, player_test.
      - name: Minestom server end to end
        run: ./gradlew :msc-core:e2eTest --console=plain

      # Scaffolds each template and builds it with its own Gradle wrapper (compiles only, starts no server).
      - name: Build every template
        if: success() || failure()
        run: ./gradlew :msc-templates:verifyTemplates --console=plain

      - name: Upload e2e transcript and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: |
            msc-core/build/e2e/
            **/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
