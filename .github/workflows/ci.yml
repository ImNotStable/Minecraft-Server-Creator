# Builds and tests every module on pushes to main and on pull requests, on Linux and Windows
# (the owner develops on Windows; #29 failed there only). See ADR 0012. The e2e job runs a real
# Minestom server through the installed core and builds every template (ADR 0022).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "msc-docs/**"
      - "*.md"
      - "msc-*/README.md"
      - "msc-*/PLAN.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "msc-docs/**"
      - "*.md"
      - "msc-*/README.md"
      - "msc-*/PLAN.md"
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the other: an OS-specific failure is the thing to see.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so ./gradlew and every run step read the same on both.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's dependencies, wrapper and build cache (including Loom's Minecraft files).
      # Only main writes the cache; other branches and PRs read it.
      - uses: gradle/actions/setup-gradle@v6

      # The default build runs unit tests only. Template builds and the Minestom server run in the
      # e2e job; nothing in CI accepts the Mojang EULA, so no Paper or Fabric server is started.
      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"
          retention-days: 7

  e2e:
    name: End to end on Minestom (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Minestom has no EULA, so this is the one real server CI may start. e2eTest scaffolds minestom-game, then
      # drives it through the installed core over MCP stdio: dev_cycle, build_batch, world tools, player_test.
      - name: Minestom server end to end
        run: ./gradlew :msc-core:e2eTest --console=plain

      # Scaffolds each template and builds it with its own Gradle wrapper (compiles only, starts no server).
      - name: Build every template
        if: success() || failure()
        run: ./gradlew :msc-templates:verifyTemplates --console=plain

      - name: Upload e2e transcript and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: |
            msc-core/build/e2e/
            **/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
