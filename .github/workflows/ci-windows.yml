# Windows leg of CI, on Flux's Gitea runner (windows-latest). Its own workflow because Gitea can't build a matrix
# from an expression. Only on a PR labelled "full-ci" or a run by hand, so Flux isn't building on every push.
name: CI (Windows)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, test and e2e (windows-latest)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        # Git Bash, so ./gradlew reads the same as on Ubuntu.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --console=plain

      - name: Minestom server end to end
        if: success() || failure()
        run: ./gradlew :msc-core:e2eTest --console=plain

      - name: Build every template
        if: success() || failure()
        run: ./gradlew :msc-templates:verifyTemplates --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v3  # shortcut: v4+ refuses non-github.com servers (Gitea); v3 works there
        with:
          name: windows-reports
          path: |
            msc-core/build/e2e/
            **/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
