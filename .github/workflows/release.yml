# Publishes a Gitea release (on omen) with the usable artifacts, and can mirror the tag to GitHub. Two ways to start it (ADR 0012):
# - push a version tag (v1.2.3), or
# - run it by hand on main with a version (1.2.3); the release then creates the tag v1.2.3 on that commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0 or 0.2.0-rc1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release notes list commits since the previous tag

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Read version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Run releases by hand from main only (this run is on $GITHUB_REF)"
              exit 1
            fi
            version="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version already exists; push nothing and pick a new version"
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version $version is not <major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp "msc-core/build/distributions/msc-core-$VERSION.zip" dist/
          for platform in paper fabric minestom neoforge forge; do
            cp "msc-agent-$platform/build/libs/msc-agent-$platform-$VERSION.jar" dist/
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      # Gitea has no `gh release`; its API does the same. A run by hand makes Gitea create the tag on the built commit.
      - name: Publish release
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Hand-written highlights first when present, then the commits since the previous tag.
          notes="msc-docs/releases/$TAG.md"
          body=""
          if [[ -f "$notes" ]]; then body="$(cat "$notes")"$'\n\n'; fi
          if prev=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null); then
            body+="## Changes since $prev"$'\n'"$(git log --no-merges --format='- %s' "$prev..$GITHUB_SHA")"
          fi
          prerelease=false; [[ "$VERSION" == *-* ]] && prerelease=true
          jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg name "Minecraft Server Creator $VERSION" \
            --arg body "$body" --argjson pre "$prerelease" \
            '{tag_name: $tag, target_commitish: $sha, name: $name, body: $body, prerelease: $pre}' > release.json
          id=$(curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            --data @release.json "$API/releases" | jq -r .id)
          for f in dist/*; do
            curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" "$API/releases/$id/assets?name=$(basename "$f")"
          done
          echo "Published $TAG (release $id)"

      # Optional: set the GH_MIRROR_TOKEN secret (a GitHub token with contents write) to also push the tag to GitHub.
      - name: Mirror tag to GitHub
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ -z "$GH_MIRROR_TOKEN" ]]; then echo "No GH_MIRROR_TOKEN secret; skipping the GitHub mirror"; exit 0; fi
          git push "https://x-access-token:$GH_MIRROR_TOKEN@github.com/ImNotStable/Minecraft-Server-Creator.git" \
            "$GITHUB_SHA:refs/tags/$TAG"
