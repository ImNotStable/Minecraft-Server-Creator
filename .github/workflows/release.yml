# Publishes a GitHub Release with the usable artifacts. Two ways to start it (ADR 0012):
# - push a version tag (v1.2.3), or
# - run it by hand on main with a version (1.2.3); the release then creates the tag v1.2.3 on that commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 0.1.0 or 0.2.0-rc1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Read version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Run releases by hand from main only (this run is on $GITHUB_REF)"
              exit 1
            fi
            version="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version already exists; push nothing and pick a new version"
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version $version is not <major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp "msc-core/build/distributions/msc-core-$VERSION.zip" dist/
          for platform in paper fabric minestom; do
            cp "msc-agent-$platform/build/libs/msc-agent-$platform-$VERSION.jar" dist/
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Creates the tag on the commit that was just built and tested; fails if it exists.
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          # Hand-written highlights, when present, go above GitHub's generated PR list.
          notes="msc-docs/releases/$TAG.md"
          if [[ -f "$notes" ]]; then flags+=(--notes-file "$notes"); fi
          gh release create "$TAG" dist/* --generate-notes \
            --title "Minecraft Server Creator $VERSION" "${flags[@]}"
