# Copies docs/wiki/ to the repo's wiki (Gitea or GitHub) whenever it changes on main.
# The wiki must exist first: create any page once in the repo's Wiki tab.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push docs/wiki to the wiki repo
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
        run: |
          if ! git clone "${SERVER%%://*}://x-access-token:${TOKEN}@${SERVER#*://}/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::warning::Wiki not created yet; create one page in the Wiki tab, then re-run this workflow"
            exit 0
          fi
          rsync -a --delete --exclude .git --exclude README.md docs/wiki/ wiki/
          # Pages link to the GitHub repo; on Gitea point those links at this server instead (ADR 0063).
          if [[ "$SERVER" != https://github.com ]]; then
            sed -i -e "s#https://github.com/ImNotStable/Minecraft-Server-Creator/blob/#$SERVER/$GITHUB_REPOSITORY/src/branch/#g" \
              -e "s#https://github.com/ImNotStable/Minecraft-Server-Creator#$SERVER/$GITHUB_REPOSITORY#g" wiki/*.md
          fi
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "wiki already up to date"; exit 0; }
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
