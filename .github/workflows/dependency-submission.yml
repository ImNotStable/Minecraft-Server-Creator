# Sends the resolved Gradle dependency graph (including transitive dependencies) to GitHub,
# so Dependabot security alerts cover what the build really uses. Without it, GitHub only
# sees what it can read statically from the build files and misses transitive libraries.
name: Dependency submission

on:
  push:
    branches: [main]
    paths:
      - "gradle/**"
      - "**/*.gradle.kts"
      - "build-logic/**"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday, so new advisories against unchanged versions still match
  workflow_dispatch:

permissions:
  contents: write # the dependency submission API needs write access to the repository

jobs:
  submit:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@v6
