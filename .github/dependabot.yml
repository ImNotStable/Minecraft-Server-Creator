# Weekly, grouped dependency updates to keep PR noise and Actions minutes low. See ADR 0012.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Fabric API's versions end in the Minecraft line (0.166.0+26.3), and Dependabot offers the next line's build
    # (+26.4) while everything else stays on 26.3. It cannot be limited to one suffix, so Fabric API is bumped by hand
    # with the Minecraft version, like Paper's 26.3.build.+ (ADR 0012).
    ignore:
      - dependency-name: "net.fabricmc.fabric-api:fabric-api"
    groups:
      # Server platforms move together with the Minecraft version; one PR so they stay in step. Dependabot puts a
      # dependency in the first group it matches, so the catch-all below needs no exclude list.
      # mcprotocollib-previous in libs.versions.toml stays one Minecraft version behind on purpose (Minestom's
      # client). It is the same module as mcprotocollib, so an ignore rule would block both: when this group's PR
      # raises it, set it back to the previous Minecraft version in that PR.
      minecraft-platforms:
        patterns:
          - "io.papermc*"
          - "net.fabricmc*"
          - "fabric-loom*"
          - "net.neoforged*"
          - "net.minecraftforge*"
          - "net.minestom*"
          - "org.geysermc*"
          - "org.mockbukkit*"
          - "com.mojang*"
      # Everything else (Gson, MCP SDK, JUnit, AssertJ, Shadow, run-paper, foojay...).
      libraries-and-plugins:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
