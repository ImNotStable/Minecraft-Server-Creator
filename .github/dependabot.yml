# Weekly, grouped dependency updates to keep PR noise and Actions minutes low. See ADR 0012.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Server platforms move together with the Minecraft version; one PR so they stay in step.
      # mcprotocollib (msc-bot) has two refs; mcprotocollib-previous must stay one Minecraft version behind,
      # so check that ref by hand in this group's PRs.
      minecraft-platforms:
        patterns:
          - "io.papermc*"
          - "net.fabricmc*"
          - "fabric-loom*"
          - "net.minestom*"
          - "org.mockbukkit*"
          - "com.mojang*"
          - "org.geysermc*"
      # Everything else (Gson, MCP SDK, JUnit, AssertJ, Shadow, run-paper, foojay...).
      libraries-and-plugins:
        patterns:
          - "*"
        exclude-patterns:
          - "io.papermc*"
          - "net.fabricmc*"
          - "fabric-loom*"
          - "net.minestom*"
          - "org.mockbukkit*"
          - "com.mojang*"
          - "org.geysermc*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
