# Every version this project uses. Change versions here only.
[versions]
java = "{{javaVersion}}"
minecraft = "{{mcVersion}}"
paper = "{{paperVersion}}"
mockbukkit = "{{mockbukkitVersion}}"
# Tests only: the newest paper-api MockBukkit runs. Raise it with mockbukkit; the plugin compiles against paper.
paper-mockbukkit = "{{paperMockbukkitVersion}}"
junit = "{{junitVersion}}"
assertj = "{{assertjVersion}}"
run-paper = "{{runPaperVersion}}"
paperweight = "{{paperweightVersion}}"
resource-factory = "{{resourceFactoryVersion}}"
msc-stdlib = "{{mscStdlibVersion}}"
sqlite-jdbc = "{{sqliteJdbcVersion}}"

[libraries]
# MSC's standard library (GUIs, items, particles, databases, player data...), shipped in libs/repo/.
msc-stdlib-paper = { module = "io.github.imnotstable.msc:msc-stdlib-paper", version.ref = "msc-stdlib" }
# Tests only: the SQLite driver the Paper server ships, so tests can open a Database.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-mockbukkit" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v{{mcVersion}}", version.ref = "mockbukkit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
resource-factory = { id = "xyz.jpenilla.resource-factory-bukkit-convention", version.ref = "resource-factory" }
