# Dev server defaults from Minecraft Server Creator (msc-templates/paper-server).
# Local only: offline mode, bound to loopback, RCON on for tools, small fast flat world.
server-ip={{serverIp}}
server-port={{serverPort}}
online-mode=false
enforce-secure-profile=false
motd={{name}} dev server
max-players=8
# Vanilla 26.x turns the whitelist on by default, which would keep the test player out.
white-list=false

enable-rcon=true
rcon.port={{rconPort}}
rcon.password={{rconPassword}}
broadcast-rcon-to-ops=false

level-name=world
level-type={{levelType}}
generator-settings={{generatorSettings}}
generate-structures=false
allow-nether=false
spawn-protection=0
view-distance=6
simulation-distance=6
difficulty=peaceful
gamemode=creative
allow-flight=true
enable-command-block=true
pause-when-empty-seconds=-1
sync-chunk-writes=false
