# Shared dependency versions for every module. Owned by the build/protocol maintainer:
# module work asks for additions here instead of hard-coding versions in a module build.

[versions]
paper = "26.3.build.257-stable"  # an exact build, raised by Renovate; code and the Paper templates compile against it
paper-mockbukkit = "26.3.build.252-stable"  # tests only: the newest paper-api MockBukkit 4.123.0 runs (build 253 changed TimeSkipEvent and added registry keys it lacks); raise with MockBukkit (ADR 0052)
gson = "2.15.0"
mcp = "2.2.0"
jackson = "3.3.0"  # floor for the MCP SDK's Jackson 3 (2.1.0 pulls 3.1.4, which has open advisories)
junit = "6.1.3"
assertj = "3.27.7"
shadow = "9.6.1"
run-paper = "3.1.0"
resource-factory = "1.4.0"  # only written into the Paper templates: plugin.yml from build.gradle.kts
paperweight = "2.0.0-beta.24"  # paperweight-userdev: only written into the Paper templates (NMS); PaperMC publishes only betas
mockbukkit = "4.123.0"  # built against Paper 26.3.build.200-stable, JUnit 6.1.3
foojay = "1.0.0"
minecraft = "26.3"          # Fabric targets the same Minecraft release as Paper
fabric-loader = "0.20.1"
fabric-api = "0.166.0+26.3"
fabric-loom = "1.19.4"     # also pinned in settings.gradle.kts, which cannot read this catalog
neoforge = "26.3.0.102"     # NeoForge for Minecraft 26.3
neoform = "26.3-1"          # vanilla Minecraft 26.3 for ModDevGradle's vanilla mode (msc-agent-forge compiles against it)
moddev = "2.0.148"          # NeoForge ModDevGradle; also pinned in settings.gradle.kts, which cannot read this catalog
forge = "26.3-66.1.9"       # Minecraft Forge for 26.3 (the recommended build)
forge-eventbus = "7.0.7"    # the EventBus that Forge 26.3 ships
forgegradle = "7.0.40"      # only written into the forge-mod template; the repo build compiles against Forge's jars
quilt-loader = "0.30.2"     # newest stable Quilt Loader; runs the Fabric agent and Fabric mods
quilt-installer = "0.15.1"
minestom = "2026.10.07-26.2"  # Minestom lags Paper: newest build targets Minecraft 26.2
velocity = "4.3.1"          # Velocity proxy (ADR 0045): server_setup installs it; the velocity-plugin template compiles against its API
mcprotocollib = "26.3-4"  # GeyserMC Java Edition protocol client for the msc-bot test player (opencollab repo)
netty = "4.2.21.Final"  # floor for mcprotocollib, which pulls netty-all 4.2.1.Final (old, with advisories); like jackson
mcprotocollib-previous = "26.2"  # the previous Minecraft version, for servers that lag Paper (Minestom); stays one behind
slf4j = "2.0.20"  # matches Minestom's slf4j-api; scaffolded Minestom servers log through slf4j-simple
msc-stdlib = "2.3.0"  # the standard library shipped in scaffolded projects (ADR 0066); raise on any API change
hikaricp = "7.1.0"  # msc-stdlib connection pool, bundled into scaffolded plugin jars
sqlite-jdbc = "3.49.1.0"  # tests only: the SQLite driver Paper 26.3 ships
adventure = "5.2.0"  # msc-stdlib compiles its MiniMessage helper against it; Paper and Velocity ship Adventure, Minestom projects get MiniMessage through msc-stdlib-minestom
h2 = "2.5.252"  # msc-stdlib: embedded and in-memory SQL database (DatabaseType.H2); scaffolded projects add it when they pick H2
mongodb = "5.15.0"  # msc-stdlib Mongo stores and repositories: compile-only, projects that use Mongo add the driver
jedis = "8.0.2"  # msc-stdlib Redis stores, caches and messaging: compile-only, projects that use Redis add it
postgresql = "42.7.14"  # tests only: msc-stdlib live checks against PostgreSQL
mariadb-client = "3.5.11"  # tests only: msc-stdlib live checks against MariaDB and MySQL

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
paper-api-mockbukkit = { module = "io.papermc.paper:paper-api", version.ref = "paper-mockbukkit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
mcp-sdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-loader-junit = { module = "net.fabricmc:fabric-loader-junit", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
forge-universal = { module = "net.minecraftforge:forge", version.ref = "forge" }
forge-fmlcore = { module = "net.minecraftforge:fmlcore", version.ref = "forge" }
forge-javafmllanguage = { module = "net.minecraftforge:javafmllanguage", version.ref = "forge" }
forge-eventbus = { module = "net.minecraftforge:eventbus", version.ref = "forge-eventbus" }
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
minestom-testing = { module = "net.minestom:testing", version.ref = "minestom" }
mcprotocollib = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcprotocollib" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
mcprotocollib-previous = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcprotocollib-previous" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.3", version.ref = "mockbukkit" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mariadb-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-client" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
